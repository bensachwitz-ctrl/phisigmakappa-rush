    // ── OFFICER: Rush pipeline (read board) ───────────────────────────────────
    function paintExecRush(main, d) { paintRush(main, d); }

    // ── OFFICER: Dues management (collection summary) ─────────────────────────
    function paintExecDues(main, d) {
      var t = d.treasury || {};
      var collected = t.duesCollectedCents || 0, outstanding = t.duesOutstandingCents || 0;
      var total = collected + outstanding, pct = total > 0 ? Math.round((collected / total) * 100) : 0;
      main.appendChild(el('<h2 class="section">Dues management</h2>'));
      main.appendChild(el(
        '<div class="hero">' +
          '<div class="l">Collected this term</div>' +
          '<div class="v">' + moneyR(collected) + '</div>' +
          '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
          '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;opacity:.92"><span>' + pct + '% collected</span><span>' + moneyR(outstanding) + ' outstanding</span></div>' +
        '</div>'
      ));
      main.appendChild(el(
        '<div class="stats">' +
          '<div class="stat"><div class="v">' + moneyR(t.balanceCents || 0) + '</div><div class="l">Chapter balance</div></div>' +
          '<div class="stat"><div class="v">' + Math.max(0, Math.round(outstanding / 45000)) + '</div><div class="l">Members behind</div></div>' +
        '</div>'
      ));
      var remind = el('<button class="btn">Send dues reminders</button>');
      remind.onclick = async function () {
        haptic();
        // Demo mode never hits the network — say so plainly, no fake count.
        if (isDemo()) { toast("Dues reminders sent to unpaid members. (Demo)", "ok"); return; }
        remind.disabled = true; remind.textContent = "Sending reminders…";
        // REAL action: the server finds unpaid active members with an email,
        // emails each a branded reminder, and returns the HONEST sent count.
        var res = await authPost("/api/mobile/exec/dues-reminder", {});
        if (res.ok) toast((res.data && res.data.message) || "Dues reminders sent.", "ok");
        else if (res.status === 403) toast("Only chapter officers can send dues reminders.", "err");
        else if (res.status === 409) toast((res.data && res.data.error) || "Online dues aren't enabled for this chapter.", "err");
        else toast((res.data && res.data.error) || "Couldn't send dues reminders. Try again shortly.", "err");
        remind.disabled = false; remind.textContent = "Send dues reminders";
      };
      main.appendChild(remind);
    }

    // ── Bottom tab bar — data-driven per view (member vs exec) ─────────────────
    function tabbar() {
      var tabs;
      if (S.view === "exec") {
        tabs = [["feed", "Roster", ICON.directory], ["events", "Announce", ICON.feed], ["rush", "Rush", ICON.rush], ["dues", "Dues", ICON.dues], ["profile", "Profile", ICON.shield]];
      } else {
        tabs = [["feed", "Feed", ICON.feed], ["events", "Events", ICON.events], ["rush", "Rush", ICON.rush]];
        if (duesEnabled()) tabs.push(["dues", "Dues", ICON.dues]);
        else tabs.push(["directory", "Directory", ICON.directory]);
        // Vote tab — appears ONLY while a ballot the member can vote in is open
        // (electionOpen). Pulled in before Profile so the live ballot is one tap
        // away; it vanishes again the moment the election closes.
        if (electionOpen()) tabs.push(["elections", "Vote", ICON.vote]);
        tabs.push(["profile", "Profile", ICON.profile]);
      }
      // Keep the active tab valid for the current tab set.
      if (!tabs.some(function (t) { return t[0] === S.tab; })) S.tab = tabs[0][0];
      var bar = el('<nav class="tabbar"></nav>');
      tabs.forEach(function (t) {
        var btn = el('<button aria-selected="' + (S.tab === t[0]) + '"><span class="ic">' + t[2] + '</span>' + t[1] + "</button>");
        btn.onclick = function () { if (S.tab === t[0]) return; S.tab = t[0]; haptic(); paintDashboard(false); };
        bar.appendChild(btn);
      });
      return bar;
    }

    // ── Universal-link deep linking ───────────────────────────────────────────
    // The app ADVERTISES universal links (AASA /app + /app/*; entitlements
    // applinks:greekstack.com; the promo banner "open straight to the right
    // page"). Tapping https://greekstack.com/app?chapter=<sub>[&tab=<tab>]
    // (or /app/<tab>?chapter=<sub>) must route the app to that chapter + tab.
    // We parse BOTH the cold-start launch URL (App.getLaunchUrl) and live
    // foreground opens (App.addListener('appUrlOpen')). All no-ops on web /
    // when the plugin is absent. The valid member tabs the link may target.
    var DEEP_LINK_TABS = ["feed", "events", "rush", "dues", "directory", "elections", "profile"];

    /**
     * Parse a deep-link URL → { chapter, tab } (either may be null). Accepts the
     * advertised /app[?chapter=&tab=] and /app/<tab>?chapter= forms, on any of
     * our hosts or the capacitor://localhost scheme. Defensive: never throws.
     */
    function parseDeepLink(url) {
      if (!url) return { chapter: null, tab: null };
      var u;
      try { u = new URL(url); } catch (e) { return { chapter: null, tab: null }; }
      var path = (u.pathname || "").replace(/\/+$/, ""); // trim trailing slash
      // Only the /app namespace carries member routing (matches AASA /app, /app/*).
      var inApp = path === "/app" || path.indexOf("/app/") === 0;
      if (!inApp) return { chapter: null, tab: null };
      var chapter = (u.searchParams.get("chapter") || "").trim().toLowerCase() || null;
      // tab from ?tab= first, else the path segment after /app/.
      var tab = (u.searchParams.get("tab") || "").trim().toLowerCase() || null;
      if (!tab && path.indexOf("/app/") === 0) {
        tab = path.slice("/app/".length).split("/")[0].toLowerCase() || null;
      }
      if (tab && DEEP_LINK_TABS.indexOf(tab) === -1) tab = null; // ignore unknown tabs
      // Only allow clean DNS-label subdomains (mirrors the web routing guard).
      if (chapter && !/^[a-z0-9][a-z0-9-]*$/.test(chapter)) chapter = null;
      return { chapter: chapter, tab: tab };
    }

    /**
     * Route an incoming deep link. Returns true when it took over navigation.
     *   • No chapter → not handled (caller falls back to normal boot/no-op).
     *   • Already signed into THAT chapter → switch to the requested tab (if any)
     *     and show the dashboard.
     *   • Otherwise → preselect that chapter at its login (or, if it isn't in the
     *     registry, drop the user on the picker rather than a dead end).
     */
    function routeDeepLink(link) {
      if (!link || !link.chapter) return false;
      var sub = link.chapter;
      // Honor the requested tab on the next dashboard paint (validated above).
      if (link.tab) S.tab = link.tab;
      // Already authenticated for this exact chapter → just re-route in place.
      if (S.session && S.session.token && S.session.subdomain === sub && !isDemo()) {
        showDashboard();
        return true;
      }
      // Find the chapter in the registry so we can theme + go straight to login.
      var match = (S.chapters || []).filter(function (c) { return c.subdomain === sub; })[0];
      if (match) {
        applyBrand(match);
        showLogin(match);
        return true;
      }
      // Unknown chapter (not provisioned / typo) → the picker, never a dead end.
      pickerSchool = null;
      showPicker();
      return true;
    }

    // Register the live foreground deep-link listener once (native only). A link
    // tapped while the app is already running arrives here.
    function registerDeepLinkListener() {
      var App = plugin("App");
      if (!App || typeof App.addListener !== "function") return;
      try {
        App.addListener("appUrlOpen", function (event) {
          var parsed = parseDeepLink(event && event.url);
          if (parsed.chapter) { haptic(); routeDeepLink(parsed); }
        });
      } catch (e) {}
    }

    // Read the cold-start launch URL (the app was OPENED by a universal link).
    async function getColdStartDeepLink() {
      var App = plugin("App");
      if (!App || typeof App.getLaunchUrl !== "function") return { chapter: null, tab: null };
      try {
        var r = await App.getLaunchUrl();
        return parseDeepLink(r && r.url);
      } catch (e) { return { chapter: null, tab: null }; }
    }

    // ── Boot ────────────────────────────────────────────────────────────────
    (async function boot() {
      hideSplash();
      // 0) Restore the per-chapter block list (Apple 1.2) so a member's blocks
      //    persist across launches and apply before the first dashboard paint.
      await loadBlocked();
      // 1) Restore a saved session → straight into the dashboard.
      var saved = await restoreSession();
      // 2) Load the chapter registry (for the picker, and to refresh tenant meta).
      S.chapters = await getRegistry();
      // 2a) Wire the live deep-link listener + read any cold-start launch URL so a
      //     universal-link tap opens straight to the right chapter/page (the
      //     capability the AASA + entitlements + promo banner advertise).
      registerDeepLinkListener();
      var coldLink = await getColdStartDeepLink();
      if (saved && saved.token && saved.subdomain) {
        // Re-bind tenant from the (possibly refreshed) registry, else trust saved.
        var match = S.chapters.filter(function (c) { return c.subdomain === saved.subdomain; })[0];
        saved.tenant = match || saved.tenant || { subdomain: saved.subdomain, name: saved.subdomain, school: "" };
        S.session = saved; S.demo = false;
        // A cold-start deep link overrides the default "resume my dashboard": it
        // may target a DIFFERENT chapter (→ login there) or just a tab on this one.
        if (coldLink.chapter && routeDeepLink(coldLink)) return;
        showDashboard();
        return;
      }
      // No saved session: a cold-start deep link still routes to that chapter's
      // login (or the picker if it isn't provisioned); otherwise the picker.
      if (coldLink.chapter && routeDeepLink(coldLink)) return;
      showPicker();
    })();
  })();
  </script>
</body>
</html>
