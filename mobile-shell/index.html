<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Greek Stack</title>
  <!--
    ────────────────────────────────────────────────────────────────────────
    BUNDLED native client (webDir). This is NOT a remote shell.

    Capacitor loads THIS file from inside the binary (capacitor://localhost),
    so the member UI ships in the app — there is no server.url pointing at the
    hosted /app. The client talks to each chapter's backend via the EXISTING
    tenant-bound mobile APIs over an ABSOLUTE platform origin (the API base):
      • GET    /api/mobile/registry           → School→Chapter picker source
      • POST   /api/mobile/auth                → tenant-bound Bearer token
      • GET    /api/mobile/data?subdomain=…    → themed dashboard payload
      •          (includes treasury + pnms ONLY when capabilities.exec)
      • POST   /api/mobile/events/rsvp         → RSVP to an event
      • POST   /api/mobile/exec/roster         → officer add/remove member
      • POST   /api/mobile/exec/reset          → officer send reset link
      • POST   /api/mobile/exec/announce       → officer post announcement
      • POST   /api/dues/checkout              → member dues Stripe checkout URL
      • DELETE /api/mobile/account             → member deletes own account
    Offline-tolerant: the last good dashboard is cached on-device (Preferences)
    and the session persists across launches.

    LOGIN-ONLY: the app has NO in-app demo. A member picks School → Chapter and
    signs in (Brother / Alumni) to reach their real per-chapter dashboard over
    the mobile APIs. The marketing DEMO lives only on the website. (App reviewers
    are given real chapter credentials in the App Review notes.)

    This bundled client mirrors the richer React member surface
    (app/app/MobileAppClient.tsx) as closely as a dependency-free static client
    can. It is what the owner SHIPS — built out, not a stub.
    ────────────────────────────────────────────────────────────────────────
  -->
  <style>
    /* ── GREEK STACK brand tokens — kept IDENTICAL to the website ──────────────
       Royal-blue + gold on deep navy. The royal-blue ramp (#1d4ed8 → #2563eb →
       #0284c7) is the exact `gs-gradient-text` used for "stack" in the wordmark
       (app/globals.css), --gold #d4af37 matches scripts/gen-ios-assets.mjs +
       capacitor.config.ts backgroundColor #0b1220, and --accent #38bdf8 is the
       bespoke-icon accent token (components/brand/icons/icon-base.tsx GS_ACCENT).
       --brand/--brand2 are re-pointed per chapter at runtime by applyBrand(); the
       neutral GreekStack identity (boot, topbar crest, wordmark) stays royal-blue
       + gold so the cold-start app matches greekstack.vercel.app exactly. */
    :root{
      --bg:#0b1220; --bg2:#0f1830; --ink:#e8eefc; --muted:#9fb0d0;
      --brand:#2563eb; --brand2:#1d4ed8; --brand3:#0284c7;
      --accent:#38bdf8; --gold:#d4af37; --card:#121d39;
      --line:rgba(255,255,255,.10); --danger:#f87171; --ok:#34d399;
      --radius:16px;
      /* Classical DISPLAY voice — matches the website's Cinzel system. The native
         WKWebView shell is offline-first, so we do NOT pull a web font (no network
         dependency, no layout shift); instead we name Cinzel first (used if ever
         bundled) and fall back to iOS's inscriptional serifs (Optima/Trajan-like
         Didot/Times) so the wordmark + headings read as the same Greek/Roman brand
         voice as the site. Body copy stays on the system sans for legibility. */
      --font-display:"Cinzel","Optima","Trajan Pro","Didot","Times New Roman",Georgia,serif;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
      font-family:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #app{min-height:100%;display:flex;flex-direction:column}
    button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
    input{font:inherit}
    .center{flex:1;display:grid;place-items:center;text-align:center;padding:24px}
    /* GreekStack wordmark — "Greek" in ink, "stack" in the site's royal-blue→cyan
       gradient (matches .gs-gradient-text in app/globals.css exactly). */
    .wordmark{font-family:var(--font-display);font-weight:700;font-size:30px;
      text-transform:uppercase;letter-spacing:.06em;line-height:1}
    .wordmark .grad{background:linear-gradient(90deg,var(--brand2),var(--brand),var(--brand3));
      -webkit-background-clip:text;background-clip:text;color:transparent}
    /* Canonical GreekStack crest — navy temple/pediment reversed in a gold disc,
       the same glyph the site renders for its maskable/PWA icon. */
    .crest-disc{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;
      display:grid;place-items:center;
      background:linear-gradient(150deg,#fbbf24,var(--gold));
      box-shadow:0 8px 26px rgba(212,175,55,.28)}
    .crest-disc svg{width:42px;height:42px;display:block}
    .sub{color:var(--muted);font-size:14px;margin-top:8px}
    .spinner{margin-top:22px;border:2px solid rgba(212,175,55,.35);border-top-color:var(--gold);
      border-radius:50%;width:26px;height:26px;display:inline-block;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
    header.topbar{position:sticky;top:0;display:flex;align-items:center;gap:10px;
      padding:14px 16px calc(14px) 16px;background:linear-gradient(180deg,var(--bg) 60%,transparent);
      backdrop-filter:saturate(140%) blur(8px);z-index:5}
    /* Topbar crest — the navy temple in a gold disc, matching the boot screen +
       the site/app icon. Holds an inline SVG (not text). */
    header.topbar .mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
      flex:none;background:linear-gradient(150deg,#fbbf24,var(--gold))}
    header.topbar .mark svg{width:18px;height:18px;display:block}
    header.topbar .title{font-family:var(--font-display);font-weight:700;font-size:16px;
      letter-spacing:.02em;flex:1;min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    header.topbar .back{font-size:13px;color:var(--muted);padding:8px;margin:-8px}
    /* Demo badge in the topbar so the no-login state is always legible. */
    header.topbar .demo{flex:none;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
      color:#1f2937;background:linear-gradient(150deg,#fcd34d,var(--gold));padding:3px 7px;border-radius:7px}
    main{flex:1;padding:8px 16px 24px 16px}
    h2.section{font-family:var(--font-display);font-size:13px;text-transform:uppercase;
      letter-spacing:1px;color:var(--muted);margin:20px 2px 10px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;
      color:var(--muted);margin:0 2px 6px}
    .field input, .search input{width:100%;padding:13px 14px;border-radius:12px;background:var(--bg2);
      border:1px solid var(--line);color:var(--ink);outline:none}
    .field input:focus, .search input:focus{border-color:var(--brand)}
    .search{margin:6px 0 4px}
    .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
      padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);
      margin-bottom:10px;min-height:56px}
    .row:active{transform:scale(.99)}
    .row .crest{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
      font-weight:800;font-size:15px;flex:none;color:#fff}
    .row .meta{flex:1;min-width:0}
    .row .meta .name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row .meta .school{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row .chev{color:var(--muted);font-size:18px;flex:none}
    .row .act{flex:none;display:flex;gap:6px}
    .row .act .ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
    .row .act .ib.danger{color:#fca5a5;background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.25)}
    .row .act .ib svg{width:16px;height:16px}
    .seg{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
    .seg button{flex:1;padding:10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
    .seg button[aria-selected="true"]{background:var(--brand);color:#fff}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
      padding:14px;border-radius:13px;font-weight:700;font-size:15px;
      background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;min-height:50px}
    .btn[disabled]{opacity:.6}
    .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
    .btn.danger{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.3);color:#fca5a5}
    .alert{padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:14px}
    .alert.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#fecaca}
    .alert.info{background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.3);color:#bfdbfe}
    .alert.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);color:#bbf7d0}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .card .h{font-weight:700;font-size:15px;margin-bottom:4px}
    .card .b{color:var(--muted);font-size:13.5px;line-height:1.5;white-space:pre-wrap}
    .card .when{color:var(--brand);font-size:12px;font-weight:600;margin-top:8px}
    .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
      background:rgba(212,175,55,.16);color:var(--gold);margin-bottom:8px}
    .pill.brand{background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--brand)}
    .pill.muted{background:var(--bg2);color:var(--muted)}
    /* Stat tiles for the dues + exec dashboards. */
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .stats.three{grid-template-columns:1fr 1fr 1fr}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
    .stat .v{font-weight:800;font-size:20px;line-height:1.1}
    .stat .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
    .meter{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;margin:10px 0 6px}
    .meter > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand3))}
    .hero{position:relative;overflow:hidden;border-radius:16px;padding:16px;color:#fff;margin-bottom:12px;
      background:linear-gradient(140deg,var(--brand),var(--brand2))}
    .hero .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.85;font-weight:700}
    .hero .v{font-size:26px;font-weight:800;margin-top:2px;line-height:1}
    .tabbar{position:sticky;bottom:0;display:flex;background:var(--bg2);border-top:1px solid var(--line);
      padding:6px 6px calc(6px + env(safe-area-inset-bottom)) 6px}
    .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:8px 2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px}
    /* Selected tab glows in the (per-chapter) brand color; bespoke SVG strokes
       inherit it through currentColor, the accent layer stays --accent. */
    .tabbar button[aria-selected="true"]{color:var(--brand)}
    .tabbar button .ic{line-height:0}
    .tabbar button .ic svg.ti{width:24px;height:24px;display:block}
    /* Event-location line: bespoke map-pin glyph + text (was an emoji). */
    .b.loc{display:flex;align-items:center;gap:6px}
    .b.loc svg.bi{width:16px;height:16px;flex:none;color:var(--brand)}
    .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
    .me{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
    .me .av{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-weight:800;
      font-size:20px;color:#fff}
    .me .nm{font-weight:800;font-size:19px}
    .me .rl{color:var(--muted);font-size:13px}
    .kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
    .kv:last-child{border-bottom:none}
    .kv .k{color:var(--muted)}
    .link{color:var(--brand);font-weight:600}
    .small{font-size:12px;color:var(--muted);line-height:1.5}
    .hidden{display:none !important}
    /* Exec view banner — makes the officer lens unmistakable. */
    .execbar{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--brand) 14%,var(--bg2));
      border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line));border-radius:12px;padding:10px 12px;margin:4px 0 10px;font-size:12.5px;font-weight:600}
    .execbar svg{width:16px;height:16px;flex:none;color:var(--brand)}
    /* View switcher under the topbar (member ⇄ exec) — only shown to officers. */
    .viewseg{margin:6px 0 0}
  </style>
</head>
<body>
  <div id="app">
    <div class="center" id="boot">
      <div>
        <div class="crest-disc" aria-hidden="true">
          <!-- Canonical GreekStack ELEVATED temple: pediment + gold cornice +
               medallion + architrave + four columns WITH capitals + bases +
               stepped stylobate + gold floor (navy temple + gold accents on the
               gold disc). Identical 100-unit geometry to brand/greekstack-seal.svg,
               app/maskable-icon/route.tsx, and <GreekstackLogo> so the bundled
               app, the website PWA icon, and the native app icon are one mark. -->
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g fill="#0F2350">
              <path d="M16 44 L50 22 L84 44 Z"/>
              <rect x="14" y="46.5" width="72" height="5" rx="1"/>
              <rect x="21.5" y="52.5" width="9" height="2.2" rx="0.6"/>
              <rect x="23" y="54.7" width="6" height="15"/>
              <rect x="21.5" y="69.7" width="9" height="2.3" rx="0.6"/>
              <rect x="37.5" y="52.5" width="9" height="2.2" rx="0.6"/>
              <rect x="39" y="54.7" width="6" height="15"/>
              <rect x="37.5" y="69.7" width="9" height="2.3" rx="0.6"/>
              <rect x="53.5" y="52.5" width="9" height="2.2" rx="0.6"/>
              <rect x="55" y="54.7" width="6" height="15"/>
              <rect x="53.5" y="69.7" width="9" height="2.3" rx="0.6"/>
              <rect x="69.5" y="52.5" width="9" height="2.2" rx="0.6"/>
              <rect x="71" y="54.7" width="6" height="15"/>
              <rect x="69.5" y="69.7" width="9" height="2.3" rx="0.6"/>
              <rect x="18" y="72.5" width="64" height="3.2" rx="0.8"/>
              <rect x="13" y="76.2" width="74" height="3.4" rx="0.8"/>
            </g>
            <g fill="#E8B53A">
              <rect x="14" y="43.4" width="72" height="2" rx="1"/>
              <circle cx="50" cy="36" r="3"/>
              <rect x="16" y="51" width="68" height="1"/>
              <rect x="13" y="79.9" width="74" height="1.1"/>
            </g>
          </svg>
        </div>
        <div class="wordmark">Greek<span class="grad">stack</span></div>
        <div class="sub">Loading your chapter…</div>
        <div class="spinner" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <script>
  /* ============================================================================
     Greek Stack — bundled native client (vanilla, dependency-free).
     State machine: boot → picker(school→chapter) → login → dashboard.
     Login-only: NO in-app demo (the marketing demo lives on the website).
     Talks to the platform via the API base. Offline-tolerant + session-persistent.
     ========================================================================== */
  (function () {
    "use strict";

    // ── API base resolution ───────────────────────────────────────────────
    // Default to the production apex; overridable at build time by replacing
    // window.__GS_API_BASE__ (a single line a CI step or operator can swap) or
    // via a <meta name="gs-api-base">. Always absolute because we run on
    // capacitor://localhost where relative paths don't reach the backend.
    var META_BASE = (function () {
      var m = document.querySelector('meta[name="gs-api-base"]');
      return m && m.content ? m.content.trim() : "";
    })();
    var API_BASE = (window.__GS_API_BASE__ || META_BASE || "https://greekstack.vercel.app").replace(/\/+$/, "");
    function api(path) { return API_BASE + (path[0] === "/" ? path : "/" + path); }

    // ── Capacitor bridge (native plugins; all optional/no-op if absent) ────
    var Cap = window.Capacitor || null;
    function plugin(n) { try { return Cap && Cap.Plugins ? Cap.Plugins[n] : null; } catch (e) { return null; } }
    function isNative() { try { return !!Cap && typeof Cap.isNativePlatform === "function" && Cap.isNativePlatform(); } catch (e) { return false; } }
    async function prefGet(k) { var P = plugin("Preferences"); if (!P) { try { return localStorage.getItem(k); } catch (e) { return null; } } try { var r = await P.get({ key: k }); return r && r.value != null ? r.value : null; } catch (e) { return null; } }
    async function prefSet(k, v) { var P = plugin("Preferences"); if (!P) { try { localStorage.setItem(k, v); } catch (e) {} return; } try { await P.set({ key: k, value: v }); } catch (e) {} }
    async function prefDel(k) { var P = plugin("Preferences"); if (!P) { try { localStorage.removeItem(k); } catch (e) {} return; } try { await P.remove({ key: k }); } catch (e) {} }
    function haptic() { var H = plugin("Haptics"); if (!H) return; try { H.selectionChanged ? H.selectionChanged() : (H.impact && H.impact({ style: "Light" })); } catch (e) {} }
    function hideSplash() { var S = plugin("SplashScreen"); if (!S) return; try { S.hide(); } catch (e) {} }
    // Open an external URL (Stripe checkout, legal links) in the system browser.
    // @capacitor/browser is NOT installed, so window.open(_blank) is the real path:
    // Capacitor routes an external https _blank to SFSafariViewController on iOS /
    // the system browser on Android. location.href is the last-resort fallback.
    function openExternal(url) {
      try { window.open(url, "_blank"); } catch (e) { try { window.location.href = url; } catch (e2) {} }
    }

    // ── Brand glyphs (inline SVG, matching the website's bespoke icon set) ──
    // The canonical GreekStack ELEVATED temple crest (navy temple + gold accents
    // on transparent — sits in a gold disc). SAME 100-unit geometry as
    // brand/greekstack-seal.svg, app/maskable-icon/route.tsx, <GreekstackLogo>,
    // and the native app icon: capitals + bases + gold cornice/medallion/
    // architrave/floor + stepped stylobate.
    var CREST_SVG =
      '<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        '<g fill="#0F2350">' +
          '<path d="M16 44 L50 22 L84 44 Z"/>' +
          '<rect x="14" y="46.5" width="72" height="5" rx="1"/>' +
          '<rect x="21.5" y="52.5" width="9" height="2.2" rx="0.6"/>' +
          '<rect x="23" y="54.7" width="6" height="15"/>' +
          '<rect x="21.5" y="69.7" width="9" height="2.3" rx="0.6"/>' +
          '<rect x="37.5" y="52.5" width="9" height="2.2" rx="0.6"/>' +
          '<rect x="39" y="54.7" width="6" height="15"/>' +
          '<rect x="37.5" y="69.7" width="9" height="2.3" rx="0.6"/>' +
          '<rect x="53.5" y="52.5" width="9" height="2.2" rx="0.6"/>' +
          '<rect x="55" y="54.7" width="6" height="15"/>' +
          '<rect x="53.5" y="69.7" width="9" height="2.3" rx="0.6"/>' +
          '<rect x="69.5" y="52.5" width="9" height="2.2" rx="0.6"/>' +
          '<rect x="71" y="54.7" width="6" height="15"/>' +
          '<rect x="69.5" y="69.7" width="9" height="2.3" rx="0.6"/>' +
          '<rect x="18" y="72.5" width="64" height="3.2" rx="0.8"/>' +
          '<rect x="13" y="76.2" width="74" height="3.4" rx="0.8"/>' +
        '</g>' +
        '<g fill="#E8B53A">' +
          '<rect x="14" y="43.4" width="72" height="2" rx="1"/>' +
          '<circle cx="50" cy="36" r="3"/>' +
          '<rect x="16" y="51" width="68" height="1"/>' +
          '<rect x="13" y="79.9" width="74" height="1.1"/>' +
        '</g>' +
      '</svg>';

    // Tab-nav glyphs — bespoke 24×24 line icons in the website's icon language
    // (currentColor stroke + a soft --accent layer), replacing the old emoji.
    // Mirrors components/brand/icons/* : feed/events/directory/profile + the
    // built-out rush/dues/exec slots.
    var ICON = {
      feed:
        '<svg class="ti" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
          '<rect x="3" y="4.5" width="18" height="15" rx="2.5" fill="var(--accent)" opacity=".18"/>' +
          '<rect x="3" y="4.5" width="18" height="15" rx="2.5" stroke="currentColor" stroke-width="1.75"/>' +
          '<path d="M5.5 12h2.2l1.7-4 2.6 8 1.8-5 1.2 1h3.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg>',
      events:
        '<svg class="ti" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
          '<rect x="3.5" y="5" width="17" height="15" rx="2.4" fill="var(--accent)" opacity=".16"/>' +
          '<rect x="3.5" y="5" width="17" height="15" rx="2.4" stroke="currentColor" stroke-width="1.75"/>' +
          '<path d="M3.5 9h17M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>' +
          '<circle cx="12" cy="14.5" r="1.7" fill="var(--accent)"/>' +
        '</svg>',
      rush:
        '<svg class="ti" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +

    // Lightweight toast — confirms an action without a navigation.

      document.body.appendChild(t);

    }

    function promptDialog(opts) {

    // ── Brand derivation ──────────────────────────────────────────────────────
    // GREEK STACK identity defaults. The interactive accent (buttons, active tab,
    // focus rings) is the royal-blue #2563eb → #1d4ed8 ramp that "stack" uses in
    // the website wordmark (gs-gradient-text); it matches the CSS :root --brand/
    // --brand2 so applyBrand's no-color path is a no-op on the cold chrome. The
    // cold-start app, the School→Chapter picker, and every PRE-LOGIN surface stay
    // on this GS royal-blue identity so the bundled app matches the site/app-icon
    // for brand parity — NEVER a random per-school hue (the old 7-color hash).
    var GS_BRAND = "#2563eb", GS_BRAND2 = "#1d4ed8";
    // Only a canonical #RRGGBB passes — guards against a malformed/empty/injection
    // value from the server payload before it touches a CSS custom property.
    function safeHex(v) { v = String(v == null ? "" : v).trim(); return /^#[0-9a-fA-F]{6}$/.test(v) ? v : null; }
    // Darken a hex by `f` (0–1) for a gradient's second stop when the chapter only
    // configured a single primary color. Pure clamp-and-scale on the RGB channels.
    function darken(hex, f) {
      var h = safeHex(hex); if (!h) return GS_BRAND2;
      var n = parseInt(h.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      r = Math.max(0, Math.round(r * (1 - f))); g = Math.max(0, Math.round(g * (1 - f))); b = Math.max(0, Math.round(b * (1 - f)));
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
    // Resolve a chapter's accent/crest tint. Prefer the chapter's REAL configured
    // brand color (brand.primaryHex from /api/mobile/data — attached to the chapter
    // object after login); otherwise fall back to the GS royal-blue identity. No
    // deterministic rainbow hash — an unbranded chapter reads as GreekStack, not a
    // random hue, preserving brand parity with the site/app-icon.
    function brandFor(ch) {
      ch = ch || {};
      var b = ch.brand || {};
      var primary = safeHex(b.primaryHex) || GS_BRAND;
      var dark = safeHex(b.primaryDarkHex) || (safeHex(b.primaryHex) ? darken(b.primaryHex, 0.25) : GS_BRAND2);
      return { primary: primary, dark: dark };
    }
    function initials(name) { var w = String(name || "").trim().split(/\s+/).filter(Boolean); if (!w.length) return "GS"; if (w.length === 1) return w[0].slice(0, 2).toUpperCase(); return (w[0][0] + w[w.length - 1][0]).toUpperCase(); }
    // Re-point the live --brand/--brand2 identity vars. Defaults to the GS royal-
    // blue; only a chapter's REAL configured color (known after login) overrides
    // it. Pre-login this is the GreekStack identity, never a hashed hue.
    function applyBrand(ch) { var b = brandFor(ch); document.documentElement.style.setProperty("--brand", b.primary); document.documentElement.style.setProperty("--brand2", b.dark); }
    // Reset the identity vars back to the GreekStack royal-blue (used when leaving
    // a chapter for the picker, so the cold chrome never keeps a tenant's color).
    function resetBrand() { document.documentElement.style.setProperty("--brand", GS_BRAND); document.documentElement.style.setProperty("--brand2", GS_BRAND2); }


    // ── App state ──────────────────────────────────────────────────────────
    // tab ∈ feed/events/rush/dues/directory/elections/profile; view ∈ member/exec.
    var S = { chapters: [], session: null, tenant: null, data: null, tab: "feed", view: "member", demo: false, blocked: {} };
    var K = { session: "gs.session", lastView: "gs.lastView", blocked: "gs.blocked" };

    // True only when the dashboard came from the no-login demo showcase.
    function isDemo() { return !!S.demo; }
    // Exec lens is allowed only when the server cleared it (capabilities.exec) or
    // in the demo. Mirrors the React client's execAllowed; every officer write is
    // ALSO re-gated server-side, so this is purely which UI is offered.
    function execAllowed() { return isDemo() || !!(S.data && S.data.capabilities && S.data.capabilities.exec === true); }
    function duesEnabled() { return isDemo() || !!(S.data && S.data.capabilities && S.data.capabilities.duesEnabled === true); }
    // True only when the chapter has a currently-OPEN election the signed-in
    // brother can vote in (the server returns election:null otherwise). Drives
    // the member "Vote" tab + the feed spotlight so the surface only appears when
    // there's a real ballot — never an empty, data-less tab.
    function electionOpen() { return !!(S.data && S.data.election && (S.data.election.seats || []).length); }

    // ── Network ─────────────────────────────────────────────────────────────
    async function getRegistry() {
      try {
        var r = await fetch(api("/api/mobile/registry"), { headers: { Accept: "application/json" } });
        var j = await r.json();
        if (j && j.ok && Array.isArray(j.chapters)) return j.chapters;
      } catch (e) {}
      // No demo fallback on iOS — the app is login-only. On a network miss the
      // picker renders its empty/retry state (see showPicker) rather than a demo.
      return [];
    }
    async function login(subdomain, email, password, role) {
      var r = await fetch(api("/api/mobile/auth"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subdomain: subdomain, email: email, password: password, role: role })
      });
      var j = await r.json();
      if (!r.ok || !j.ok) throw new Error(j.error || "Sign in failed.");
      return j;
    }
    async function loadData(subdomain, token) {
      var r = await fetch(api("/api/mobile/data?subdomain=" + encodeURIComponent(subdomain)), {
        headers: { Authorization: "Bearer " + token }
      });
      var j = await r.json();
      if (r.status === 401) { var e = new Error("expired"); e.code = 401; throw e; }
      if (!r.ok || !j.ok) throw new Error(j.error || "Could not load chapter data.");
      return j;
    }
    // Authed POST helper for the officer write routes + dues checkout.
    async function authPost(path, body) {
      var r = await fetch(api(path), {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + S.session.token },
        body: JSON.stringify(Object.assign({ subdomain: S.session.subdomain }, body || {}))
      });
      var j = await r.json().catch(function () { return {}; });
      return { status: r.status, ok: r.ok && j.ok, data: j };
    }

    // ── Moderation (Apple Guideline 1.2) ──────────────────────────────────────
    // REPORT objectionable cross-member content (an officer announcement, a
    // career post, or a member/alumni profile). Posts to the token-bound
    // /api/mobile/report endpoint, which records the report AND notifies chapter
    // admins through the existing notification path. In the read-only demo we
    // confirm the flow without hitting the network.
    async function reportContent(target) {
      var reason = await promptDialog({
        title: "Report this content",
        message: "Tell a chapter admin what's wrong. Your report is sent to chapter officers for review.",
        placeholder: "What's objectionable?",
        confirmText: "Send report", danger: true
      });
      if (reason === null) return; // cancelled
      if (isDemo()) { toast("Report sent to chapter admins. (Demo)", "ok"); return; }
      var res = await authPost("/api/mobile/report", {
        kind: "report",
        targetType: target.type || "other",
        targetId: target.id || "",
        targetName: target.name || "",
        reason: reason || ""
      });
      if (res.ok) toast("Report sent to chapter admins.", "ok");
      else toast((res.data && res.data.error) || "Couldn't send the report. Try again.", "err");
    }

    // BLOCK / UNBLOCK a member. The hide is enforced on-device (the blocked set,
    // persisted in Preferences) AND a moderator is notified via /api/mobile/report
    // so a member can't be silently shadow-blocked off the record. Reversible.
    async function toggleBlock(member) {
      var id = member && member.id; if (!id) return;
      var nowBlocked = !isBlocked(id);
      if (nowBlocked) {
        var yes = await confirmDialog({
          title: "Block " + (member.name || "this member") + "?",
          message: "You won't see their directory listing or their posts. Chapter admins are notified. You can unblock them anytime.",
          confirmText: "Block member", danger: true
        });
        if (!yes) return;
        blockedSet()[id] = 1;
      } else {
        delete blockedSet()[id];
      }
      await persistBlocked();
      haptic();
      // Notify a moderator (best-effort; the on-device hide already applied).
      if (!isDemo()) {
        authPost("/api/mobile/report", {
          kind: nowBlocked ? "block" : "unblock",
          targetType: "member",
          targetId: id,
          targetName: member.name || ""
        }).catch(function () {});
      }
      toast(nowBlocked ? ((member.name || "Member") + " blocked.") : ((member.name || "Member") + " unblocked."), "ok");
      paintDashboard(false); // re-render to hide/show the member's content
    }

    // ── Persistence ─────────────────────────────────────────────────────────
    async function saveSession(s) { S.session = s; await prefSet(K.session, JSON.stringify(s)); }
    async function clearSession() { S.session = null; S.tenant = null; S.data = null; S.demo = false; S.view = "member"; await prefDel(K.session); await prefDel(K.lastView); }
    async function restoreSession() { var raw = await prefGet(K.session); if (!raw) return null; try { return JSON.parse(raw); } catch (e) { return null; } }
    async function cacheView(d) { try { var j = JSON.stringify({ at: Date.now(), data: d }); if (j.length < 400000) await prefSet(K.lastView, j); } catch (e) {} }
    async function readCachedView() { var raw = await prefGet(K.lastView); if (!raw) return null; try { return JSON.parse(raw); } catch (e) { return null; } }

    // ── Block list (Apple 1.2) ────────────────────────────────────────────────
    // A member can BLOCK another member; blocked members' directory rows + feed
    // content are hidden client-side. The set is PERSISTED in Capacitor
    // Preferences, scoped per-chapter (keyed by subdomain) so a block in one
    // chapter never leaks into another, and survives app restarts. Shape:
    // { "<subdomain>": { "<memberId>": 1 } }.
    async function loadBlocked() {
      var raw = await prefGet(K.blocked);
      try { S.blocked = raw ? (JSON.parse(raw) || {}) : {}; } catch (e) { S.blocked = {}; }
    }
    function blockedSet() {
      var sub = S.session && S.session.subdomain ? S.session.subdomain : "_";
      if (!S.blocked[sub]) S.blocked[sub] = {};
      return S.blocked[sub];
    }
    function isBlocked(id) { return !!(id && blockedSet()[id]); }
    async function persistBlocked() { try { await prefSet(K.blocked, JSON.stringify(S.blocked)); } catch (e) {} }

    // ── Screen: School → Chapter picker ───────────────────────────────────────

    function showPicker() {

      var wrap = el('<div></div>');

      var schools = {};
      S.chapters.forEach(function (c) { var k = c.school || "Other"; (schools[k] = schools[k] || []).push(c); });
      var schoolNames = Object.keys(schools).sort();

      if (!pickerSchool) {
        // Logo-anchored entry — the owner's "simple with the logo, then choose
        // school and chapter" ask. The canonical GreekStack crest + wordmark sit

            '<div class="wordmark">Greek<span class="grad">stack</span></div>' +

        ));
        if (!schoolNames.length) {

          retry.onclick = async function () { haptic(); S.chapters = await getRegistry(); showPicker(); };
          main.appendChild(retry);
        } else {
          main.appendChild(el('<h2 class="section">Choose your school</h2>'));
          var sb = el('<div class="search"><input placeholder="Search schools" inputmode="search" autocapitalize="words" /></div>');
          main.appendChild(sb);
          var list = el('<div></div>');
          function paintSchools(q) {
            list.innerHTML = "";

            if (!filtered.length) { list.appendChild(el('<div class="empty">No schools match “' + esc(q) + '”.</div>')); return; }

          paintSchools("");
          main.appendChild(list);
        }
      } else {
        main.appendChild(el('<h2 class="section">' + esc(pickerSchool) + "</h2>"));

        var cl = el('<div></div>');
        chs.forEach(function (c) {

          );

    // ── Screen: Login ─────────────────────────────────────────────────────────
    function showLogin(tenant) {
      var wrap = el('<div></div>');
      wrap.appendChild(topbar(tenant.name, function () { showPicker(); }));
      var main = el('<main></main>');
      main.appendChild(el('<h2 class="section">Sign in to ' + esc(tenant.name) + "</h2>"));

      var seg = el('<div class="seg" role="tablist">' +
        '<button role="tab" data-role="brother" aria-selected="true">Brother</button>' +
        '<button role="tab" data-role="alumni" aria-selected="false">Alumni</button></div>');
      var role = "brother";
      seg.querySelectorAll("button").forEach(function (b) {
        b.onclick = function () { role = b.getAttribute("data-role"); seg.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); }); haptic(); };
      });
      main.appendChild(seg);

      var errBox = el('<div></div>');
      main.appendChild(errBox);

      var form = el(
        '<form>' +
          '<div class="field"><label>Email</label><input type="email" inputmode="email" autocapitalize="off" autocomplete="email" required placeholder="you@example.com" /></div>' +
          '<div class="field"><label>Password</label><input type="password" autocomplete="current-password" required placeholder="••••••••" /></div>' +
          '<button class="btn" type="submit">Sign In</button>' +
        "</form>"
      );
      var inputs = form.querySelectorAll("input");
      var submit = form.querySelector(".btn");
      form.onsubmit = async function (e) {
        e.preventDefault();
        errBox.innerHTML = "";
        submit.disabled = true; submit.textContent = "Signing in…";
        try {
          var res = await login(tenant.subdomain, inputs[0].value.trim().toLowerCase(), inputs[1].value, role);
          var session = { token: res.token, user: res.user, subdomain: tenant.subdomain, tenant: tenant };
          await saveSession(session);
          S.demo = false; S.view = "member"; S.tab = "feed";
          haptic();
          showDashboard();
        } catch (err) {
          errBox.appendChild(el('<div class="alert err">' + esc(err.message || "Sign in failed.") + "</div>"));
          submit.disabled = false; submit.textContent = "Sign In";
        }
      };
      main.appendChild(form);

      // Forgot-password off-ramp — opens the chapter's web reset flow in the
      // system browser (the app itself is login-only; no demo path).
      var forgot = el('<button class="btn ghost" type="button" style="margin-top:10px">Forgot password?</button>');
      forgot.onclick = function () {
        haptic();
        // Open THIS chapter's web reset flow in the system browser. Prefer the
        // chapter's custom domain; else its subdomain under the platform apex.
        var apexHost = API_BASE.replace(/^https?:\/\//, "").replace(/\/+$/, "");
        var host = tenant.domain ? tenant.domain : (tenant.subdomain + "." + apexHost);
        openExternal("https://" + host + "/portal/reset-password");
      };
      main.appendChild(forgot);

      main.appendChild(el('<p class="small" style="margin-top:14px;text-align:center">Use the credentials your chapter gave you. Your session is bound to ' + esc(tenant.name) + " only.</p>"));

      wrap.appendChild(main);
      render(wrap);
    }

    // Attach the chapter's REAL configured brand color (from /api/mobile/data's
    // chapter.brand) onto the session tenant so brandFor()/applyBrand() theme the
    // dashboard in the chapter's actual color. Until this runs (pre-login / first
    // paint), the tenant carries no brand and everything stays GS royal-blue.
    function adoptBrandFromData(data) {
      var s = S.session; if (!s || !s.tenant || !data || !data.chapter) return;
      var b = data.chapter.brand;
      if (b && (safeHex(b.primaryHex) || safeHex(b.primaryDarkHex))) {
        s.tenant.brand = { primaryHex: safeHex(b.primaryHex), primaryDarkHex: safeHex(b.primaryDarkHex) };
      }
    }

    // ── Screen: Dashboard ─────────────────────────────────────────────────────
    async function showDashboard() {
      var s = S.session; if (!s) { showPicker(); return; }
      if (isDemo()) { paintDashboard(false); return; }
      applyBrand(s.tenant);
      // Show cached first if available, then refresh.
      var cached = await readCachedView();
      if (cached && cached.data) { adoptBrandFromData(cached.data); applyBrand(s.tenant); S.data = cached.data; paintDashboard(true); }
      else paintLoading(s.tenant.name);

      try {
        var data = await loadData(s.subdomain, s.token);
        adoptBrandFromData(data); applyBrand(s.tenant);
        S.data = data; await cacheView(data); paintDashboard(false);
      } catch (err) {
        if (err && err.code === 401) { await clearSession(); showPicker(); return; }
        if (!S.data) {
          var wrap = el('<div></div>');
          wrap.appendChild(topbar(s.tenant.name, null));
          var m = el('<main></main>');
          m.appendChild(el('<div class="alert err" style="margin-top:16px">' + esc(err.message || "Network error.") + "</div>"));
          var retry = el('<button class="btn ghost" type="button">Retry</button>');
          retry.onclick = showDashboard; m.appendChild(retry);
          var out = el('<button class="btn ghost" type="button" style="margin-top:10px">Sign out</button>');
          out.onclick = async function () { await clearSession(); pickerSchool = null; showPicker(); };
          m.appendChild(out);
          wrap.appendChild(m); render(wrap);
        }
      }
    }
    // Refetch after a successful officer write so the change reflects the server's
    // truth. Demo mutates S.data locally instead (no API), so it short-circuits.
    async function refetchDashboard() {
      if (isDemo()) { paintDashboard(false); return; }
      var s = S.session; if (!s || !s.token) return;
      try { var data = await loadData(s.subdomain, s.token); S.data = data; await cacheView(data); } catch (e) {}
      paintDashboard(false);
    }

    function paintLoading(name) {
      var wrap = el('<div></div>');
      wrap.appendChild(topbar(name, null));
      wrap.appendChild(el('<div class="center"><div><div class="spinner"></div><div class="sub" style="margin-top:14px">Loading your chapter…</div></div></div>'));
      render(wrap);
    }

    function paintDashboard(isStale) {
      var d = S.data || {}; var s = S.session;

      if (S.view === "exec" && !execAllowed()) S.view = "member";

          '<button role="tab" data-v="member" aria-selected="' + (S.view === "member") + '">Member view</button>' +
          '<button role="tab" data-v="exec" aria-selected="' + (S.view === "exec") + '">Exec view</button></div>');
        vs.querySelectorAll("button").forEach(function (b) {
          b.onclick = function () {

      }

      if (isStale) main.appendChild(el('<div class="alert info">Showing your last saved view — reconnecting…</div>'));

        main.appendChild(el('<div class="alert info">Chapter billing: ' + esc(d.billing.reason) + (d.billing.daysLeft != null ? " · " + d.billing.daysLeft + " days left" : "") + "</div>"));

        else if (S.tab === "rush") paintExecRush(main, d);

        else paintProfile(main, d);

    // ── MEMBER: Feed ──────────────────────────────────────────────────────────
    function paintFeed(main, d) {
      // Open-election SPOTLIGHT — surfaces the live ballot at the top of the feed
      // so a member can't miss it, and taps straight into the Vote tab. Only
      // shown while an election is open (electionOpen); no dead control otherwise.
      if (electionOpen()) {
        var ev = d.election;
        var seatCount = (ev.seats || []).length;

            '<div class="h">' + esc(ev.title) + "</div>" +
            '<div class="b">' + (done
              ? "Thanks for voting. You can review the ballot any time."
              : (votedCount > 0
                  ? ("You've voted in " + votedCount + " of " + seatCount + " race" + (seatCount === 1 ? "" : "s") + " — finish your ballot.")
                  : ("Cast your secret ballot in " + seatCount + " race" + (seatCount === 1 ? "" : "s") + "."))) +

    // Small "Report" affordance appended to a content card. Wired to the real

        '<span style="width:14px;height:14px;display:inline-flex">' + ICON.flag + '</span>Report</button>');

            if (isDemo()) { toast("RSVP saved.", "ok"); return; }

              });

    // Build an RFC-5545 .ics and download it (same as the web client).
    function addToCalendar(e) {
      function dt(iso) { return new Date(iso).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }
      var start = dt(e.startsAt);
      var end = dt(e.endsAt || new Date(new Date(e.startsAt).getTime() + 2 * 3600000).toISOString());
      var ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Greekstack//App//EN", "BEGIN:VEVENT",
        "UID:" + (e.id || "evt") + "@greekstack", "DTSTAMP:" + dt(new Date().toISOString()),
        "DTSTART:" + start, "DTEND:" + end, "SUMMARY:" + String(e.name || "Chapter Event").replace(/\n/g, " "),
        "LOCATION:" + String(e.location || "").replace(/\n/g, " "), "DESCRIPTION:" + String(e.description || "").replace(/\n/g, " "),
        "END:VEVENT", "END:VCALENDAR"].join("\r\n");
      try {
        var blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = String(e.name || "event").replace(/[^a-z0-9]+/gi, "-").toLowerCase() + ".ics";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      } catch (err) {}
      toast("Added to your calendar.", "ok");
    }

    // ── MEMBER: Rush / pledges (read-only board) ──────────────────────────────
    function paintRush(main, d) {

      ));

            '<span class="pill ' + (p.status === "BID_EXTENDED" ? "brand" : "muted") + '" style="margin:0">' + (p.status === "BID_EXTENDED" ? "Bid sent" : ((p.votesCount || 0) + " votes")) + "</span>" +
          "</div>"
        ));

    }

    // ── MEMBER: Elections (secret-ballot voting) ──────────────────────────────
    // Mirrors the web ElectionsVoter contract: one ballot per SEAT, secret (the
    // server returns aggregate per-candidate counts + this member's OWN choices
    // in d.myBallot), idempotent (a seat already voted shows a locked "Voted"
    // state, no re-cast). Casts via authPost("/api/mobile/elections/vote",
    // {seatId, candidateId}) and adopts the refreshed {election, myBallot} the
    // route returns so the tally + voted state update without a full reload.
    function paintElections(main, d) {
      var ev = d.election;
      main.appendChild(el('<h2 class="section">Elections</h2>'));
      // Empty state — the tab is normally hidden when nothing is open, but if it
      // is reached with no live ballot (e.g. the election just closed) show an
      // explicit empty state, never a blank surface.
      if (!ev || !(ev.seats || []).length) {
        main.appendChild(el('<div class="empty">No open elections right now. You\'ll see the ballot here the moment voting opens.</div>'));
        return;
      }
      var myBallot = d.myBallot || {};
      main.appendChild(el(
        '<div class="hero">' +
          '<div class="l">' + esc(ev.title) + '</div>' +
          '<div class="v" style="font-size:22px">' + (ev.ballotsCast || 0) + ' cast</div>' +
          '<div style="font-size:12px;opacity:.85;margin-top:4px">Secret ballot · ' + (ev.totalEligible || 0) + ' eligible voters</div>' +
        '</div>'
      ));

      ev.seats.forEach(function (seat) {
        var votedFor = myBallot[seat.id] || null;
        var card = el('<div class="card"></div>');
        card.appendChild(el('<div class="h">' + esc(seat.title) + (votedFor ? ' <span class="pill brand" style="margin-left:6px">Voted</span>' : "") + "</div>"));
        (seat.candidates || []).forEach(function (c) {
          var isMine = votedFor === c.id;
          var row = el(
            '<div class="row" style="cursor:' + (votedFor ? "default" : "pointer") + ';' + (isMine ? "border-color:var(--brand)" : "") + '">' +
              '<div class="meta"><div class="name">' + esc(c.name) + (isMine ? ' <span style="color:var(--brand)">✓ Your vote</span>' : "") + "</div>" +
                '<div class="school">' + esc([c.year, c.blurb].filter(Boolean).join(" · ")) + "</div></div>" +
              '<span class="pill muted" style="margin:0">' + (c.votes || 0) + " vote" + ((c.votes || 0) === 1 ? "" : "s") + "</span>" +
            "</div>"
          );
          // Only an UNVOTED seat is tappable (one ballot per seat; the server is
          // the real guard, the UI just prevents an obvious double-tap).
          if (!votedFor) {
            row.onclick = function () { haptic(); castBallot(seat, c, row); };
          }
          card.appendChild(row);
        });
        if (!votedFor) {
          card.appendChild(el('<div class="small" style="margin-top:8px;color:var(--muted)">Tap a candidate to cast your secret ballot. You can vote once per race.</div>'));
        }
        main.appendChild(card);
      });
    }

    // Cast one secret ballot for a seat, then adopt the refreshed view the vote
    // route returns (new tally + this member's choices) and repaint.
    async function castBallot(seat, candidate, row) {
      var ok = await confirmDialog({
        title: "Confirm your vote",
        message: 'Vote for ' + (candidate.name) + ' as ' + (seat.title) + '? Your ballot is secret and can\'t be changed.',
        confirmText: "Cast ballot"
      });
      if (!ok) return;
      if (isDemo()) {
        // Demo: reflect the vote locally so the flow is fully exercised offline.
        S.data.myBallot = Object.assign({}, S.data.myBallot, mapEntry(seat.id, candidate.id));
        var cand = (seat.candidates || []).filter(function (x) { return x.id === candidate.id; })[0];
        if (cand) cand.votes = (cand.votes || 0) + 1;
        S.data.election.ballotsCast = (S.data.election.ballotsCast || 0) + 1;
        toast("Vote recorded. Thanks for voting!", "ok");
        paintDashboard(false);
        return;
      }
      if (row) { row.style.opacity = "0.6"; row.style.pointerEvents = "none"; }
      try {
        var res = await authPost("/api/mobile/elections/vote", { seatId: seat.id, candidateId: candidate.id });
        if (res.ok && res.data) {
          // Adopt the authoritative refreshed view (tally + myBallot).
          S.data.election = res.data.election;
          S.data.myBallot = res.data.myBallot || {};
          toast("Vote recorded. Thanks for voting!", "ok");
          paintDashboard(false);
        } else if (res.status === 409) {
          toast(res.data.error || "You've already voted for this race.", "info");
          refetchDashboard();
        } else {
          toast(res.data.error || "Couldn't record your vote. Try again.", "err");
          if (row) { row.style.opacity = ""; row.style.pointerEvents = ""; }
        }
      } catch (e) {
        toast("Couldn't reach the server. Try again.", "err");
        if (row) { row.style.opacity = ""; row.style.pointerEvents = ""; }
      }
    }

    // Tiny helper: a one-key object (kept ES5-friendly for the WKWebView shell).
    function mapEntry(k, v) { var o = {}; o[k] = v; return o; }

    // ── MEMBER: Dues (balance + real Stripe checkout) ─────────────────────────
    function paintDues(main, d) {
      var dues = d.dues || {}; var cfg = dues.config || {};
      main.appendChild(el('<h2 class="section">Dues</h2>'));
      main.appendChild(el(
        '<div class="hero">' +
          '<div class="l">' + esc(cfg.label || "Active chapter dues") + '</div>' +
          '<div class="v">' + money(cfg.amountCents || 0) + '</div>' +
          '<div style="font-size:12px;opacity:.85;margin-top:4px">' + esc(cfg.year || "Active semester") + '</div>' +
        '</div>'
      ));
      if (dues.isPaid) {
        main.appendChild(el('<div class="alert ok">Dues settled — thank you!</div>'));
      } else if (cfg.enabled) {
        main.appendChild(el('<div class="alert info">Action required · your dues are unpaid.</div>'));
        var pay = el('<button class="btn">Pay online with Stripe</button>');
        pay.onclick = async function () {
          haptic();
          if (isDemo()) { toast("Demo: checkout opens Stripe for a real member.", "info"); return; }
          pay.disabled = true; pay.textContent = "Opening Stripe…";
          try {
            var res = await authPost("/api/dues/checkout", {});
            if (res.ok && res.data.url) { openExternal(res.data.url); pay.disabled = false; pay.textContent = "Pay online with Stripe"; }
            else if (res.status === 409) { toast(res.data.error || "You're already marked paid.", "info"); refetchDashboard(); }
            else { toast(res.data.error || "Online dues aren't available. Pay via your treasurer.", "err"); pay.disabled = false; pay.textContent = "Pay online with Stripe"; }
          } catch (e) { toast("Couldn't reach Stripe. Try again.", "err"); pay.disabled = false; pay.textContent = "Pay online with Stripe"; }
        };
        main.appendChild(pay);
      }
      main.appendChild(el('<h2 class="section">Payment ledger</h2>'));
      var pays = dues.payments || [];
      if (!pays.length) { main.appendChild(el('<div class="empty">No transactions yet.</div>')); return; }
      pays.forEach(function (p) {
        main.appendChild(el(
          '<div class="card" style="display:flex;justify-content:space-between;align-items:center">' +
            '<div><div class="h" style="margin:0">Dues · ' + esc(p.year) + '</div><div class="small">' + esc(p.method || "—") + " · " + esc(new Date(p.createdAt).toLocaleDateString()) + "</div></div>" +
            '<div style="text-align:right"><div class="h" style="margin:0">' + money(p.amountCents) + '</div><div class="small" style="color:' + (p.status === "PAID" ? "var(--ok)" : "var(--gold)") + '">' + esc(p.status) + "</div></div>" +
          "</div>"
        ));
      });
    }

    // ── MEMBER: Directory ─────────────────────────────────────────────────────
    function paintDirectory(main, d) {
      var rosterAll = (d.roster && d.roster.actives) || [];
      var alumniAll = (d.roster && d.roster.alumni) || [];
      // Apple 1.2 — hide BLOCKED members from the directory entirely. The block
      // set is persisted in Preferences (per-chapter) and applied here before
      // any row renders. The member's own profile is never in this list.
      var roster = rosterAll.filter(function (m) { return !isBlocked(m.id); });
      var alumni = alumniAll.filter(function (m) { return !isBlocked(m.id); });
      var hiddenCount = (rosterAll.length - roster.length) + (alumniAll.length - alumni.length);
      main.appendChild(el('<h2 class="section">Directory · ' + roster.length + " active" + (roster.length === 1 ? "" : "s") + "</h2>"));
      var sb = el('<div class="search"><input placeholder="Search members" inputmode="search" /></div>');
      main.appendChild(sb);
      var list = el('<div></div>'); main.appendChild(list);
      var alumniHead = el('<h2 class="section">Alumni · ' + alumni.length + "</h2>");
      var alumniList = el('<div></div>');
      function paint(q) {
        list.innerHTML = ""; alumniList.innerHTML = "";
        var ql = q.toLowerCase();
        var fa = roster.filter(function (m) { return (m.name || "").toLowerCase().indexOf(ql) >= 0; });
        if (!fa.length) { list.appendChild(el('<div class="empty">No members match.</div>')); }
        fa.forEach(function (m) { list.appendChild(memberRow(m, [m.position, m.major, m.year])); });
        var fl = alumni.filter(function (m) { return (m.name || "").toLowerCase().indexOf(ql) >= 0; });
        fl.forEach(function (m) { alumniList.appendChild(memberRow(m, [m.jobTitle, m.employer, m.graduationYear ? "'" + String(m.graduationYear).slice(-2) : ""])); });
      }
      function memberRow(m, parts) {
        var b = brandFor(S.session.tenant);
        var row = el(
          '<div class="row" style="cursor:default">' +
            '<div class="crest" style="background:linear-gradient(135deg,' + b.primary + "," + b.dark + ')">' + esc(initials(m.name)) + "</div>" +
            '<div class="meta"><div class="name">' + esc(m.name) + '</div><div class="school">' + esc(parts.filter(Boolean).join(" · ")) + "</div></div>" +
            '<div class="act"></div>' +
          "</div>"
        );
        var act = row.querySelector(".act");
        // REPORT this member's profile → /api/mobile/report (real, wired).
        var rep = el('<button type="button" class="ib" aria-label="Report ' + esc(m.name || "member") + '">' + ICON.flag + '</button>');
        rep.onclick = function () { haptic(); reportContent({ type: "member", id: m.id, name: m.name }); };
        // BLOCK / UNBLOCK this member → hides their content on-device + notifies admins.
        var blk = el('<button type="button" class="ib danger" aria-label="Block ' + esc(m.name || "member") + '">' + ICON.block + '</button>');
        blk.onclick = function () { haptic(); toggleBlock(m); };
        act.appendChild(rep); act.appendChild(blk);
        return row;
      }
      sb.querySelector("input").oninput = function (e) { paint(e.target.value); };
      paint("");
      if (alumni.length) { main.appendChild(alumniHead); main.appendChild(alumniList); }
      // Blocked-members review strip — shows the count + a way to UNBLOCK
      // (reversible, as Apple requires). Only rendered when something is blocked.
      if (hiddenCount > 0) main.appendChild(blockedReview(rosterAll.concat(alumniAll)));
    }

    // A collapsible list of the member's blocked members, each with an Unblock
    // button (reversibility). Names are resolved from the current roster payload;
    // a blocked id no longer in the roster shows as "Blocked member".
    function blockedReview(allMembers) {
      var ids = Object.keys(blockedSet());
      var card = el('<div class="card" style="margin-top:8px"></div>');
      card.appendChild(el('<div class="h">Blocked members · ' + ids.length + "</div>"));
      card.appendChild(el('<div class="small" style="margin-bottom:10px">You\'ve hidden these members. Unblock to see their listing and posts again.</div>'));
      ids.forEach(function (id) {
        var m = allMembers.filter(function (x) { return x.id === id; })[0] || { id: id, name: "Blocked member" };
        var rowEl = el('<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0"></div>');
        rowEl.appendChild(el('<div class="small" style="color:var(--ink)">' + esc(m.name || "Blocked member") + "</div>"));
        var un = el('<button type="button" class="btn ghost" style="width:auto;padding:6px 14px;min-height:36px">Unblock</button>');
        un.onclick = function () { haptic(); toggleBlock(m); };
        rowEl.appendChild(un);
        card.appendChild(rowEl);
      });
      return card;
    }

    // ── MEMBER + OFFICER: Profile (with account deletion) ─────────────────────
    function paintProfile(main, d) {
      var p = d.profile || {}; var s = S.session; var b = brandFor(s.tenant);
      main.appendChild(el(
        '<div class="me">' +
          '<div class="av" style="background:linear-gradient(135deg,' + b.primary + "," + b.dark + ')">' + esc(initials(p.name || (s.user && s.user.email))) + "</div>" +
          '<div><div class="nm">' + esc(p.name || (s.user && s.user.email) || "Member") + '</div><div class="rl">' + esc((d.role || "brother") + " · " + ((d.chapter && d.chapter.name) || s.tenant.name)) + "</div></div>" +
        "</div>"
      ));
      var card = el('<div class="card"></div>');
      [["Email", p.email || (s.user && s.user.email)], ["Major", p.major], ["Year", p.year], ["Pledge class", p.pledgeClass], ["Position", p.position], ["Hometown", p.hometown]].forEach(function (kv) {
        if (kv[1]) card.appendChild(el('<div class="kv"><span class="k">' + esc(kv[0]) + '</span><span>' + esc(kv[1]) + "</span></div>"));
      });
      if (card.children.length) main.appendChild(card);
      if (d.standing && d.standing.score != null) {
        main.appendChild(el('<div class="card"><div class="h">Standing</div><div class="b">' + esc(d.standing.score) + " / " + esc(d.standing.max) + " (" + esc(d.standing.pct) + "%) · " + esc(d.standing.standing || "") + "</div></div>"));
      }

      var out = el('<button class="btn ghost" type="button" style="margin-top:8px">Sign out</button>');
      out.onclick = async function () { haptic(); await clearSession(); pickerSchool = null; showPicker(); };
      main.appendChild(out);

      // ── DANGER ZONE — in-app account deletion (Apple 5.1.1(v)) ──────────────
      // The signed-in member deletes their OWN account + member data:
      // DELETE /api/mobile/account → sign out → picker. Demo demonstrates the
      // flow without calling the API.
      var dz = el('<div class="card" style="margin-top:14px;border-color:rgba(248,113,113,.25)"></div>');
      dz.appendChild(el('<div class="h">Account</div>'));
      dz.appendChild(el('<div class="small" style="margin-bottom:10px">Permanently delete your Greek Stack account and your member data for this chapter. This can\'t be undone.</div>'));
      var del = el('<button class="btn danger" type="button">Delete account</button>');
      del.onclick = async function () {
        var yes = await confirmDialog({
          title: "Delete your account?",
          message: "This permanently deletes your Greek Stack account and your member data for this chapter. This cannot be undone.",
          confirmText: "Delete account", danger: true
        });
        if (!yes) return;
        if (isDemo()) { toast("Account deleted. (Demo — nothing was changed.)", "ok"); await clearSession(); pickerSchool = null; showPicker(); return; }
        del.disabled = true; del.textContent = "Deleting…";
        try {
          var r = await fetch(api("/api/mobile/account?subdomain=" + encodeURIComponent(S.session.subdomain)), {
            method: "DELETE", headers: { Authorization: "Bearer " + S.session.token }
          });
          var j = await r.json().catch(function () { return {}; });
          if (r.ok && j.ok) { toast("Your account has been deleted.", "ok"); await clearSession(); pickerSchool = null; showPicker(); }
          else { toast(j.error || "Couldn't delete your account. Try again.", "err"); del.disabled = false; del.textContent = "Delete account"; }
        } catch (e) { toast("Network error. Try again.", "err"); del.disabled = false; del.textContent = "Delete account"; }
      };
      dz.appendChild(del);
      main.appendChild(dz);

      // ── Legal — in-app links to Privacy / Terms / Support (Apple polish) ─────
      // Apple wants a reachable Privacy Policy and, for an app handling member PII
      // + payments, an in-app legal link is expected. The Next app already serves
      // /privacy, /terms, /support, so we build the URLs off the SAME origin the
      // app talks to (API_BASE — the live deploy, custom-domain or vercel) and
      // open them in the system browser via openExternal (SFSafariViewController).
      var legal = el('<div class="legal" style="display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:14px"></div>');
      [["Privacy Policy", "/privacy"], ["Terms", "/terms"], ["Support", "/support"]].forEach(function (lk) {
        var a = el('<button class="linklike" type="button" style="background:none;border:0;padding:6px 2px;font-size:13px;color:#475569;text-decoration:underline;text-underline-offset:2px;cursor:pointer;min-height:44px">' + esc(lk[0]) + '</button>');
        a.onclick = function () { haptic(); openExternal(API_BASE + lk[1]); };
        legal.appendChild(a);
      });
      main.appendChild(legal);

      main.appendChild(el('<p class="small" style="text-align:center;margin-top:10px">Greek Stack · bundled app</p>'));
    }

    // ── OFFICER: Roster (add / remove / reset — persists to the server) ───────
    function paintExecRoster(main, d) {
      var actives = (d.roster && d.roster.actives) || [];
      var alumni = (d.roster && d.roster.alumni) || [];
      main.appendChild(el(
        '<div class="stats">' +
          '<div class="stat"><div class="v">' + actives.length + '</div><div class="l">Active members</div></div>' +
          '<div class="stat"><div class="v">' + alumni.length + '</div><div class="l">Alumni</div></div>' +
        '</div>'
      ));
      var add = el('<button class="btn">Add member</button>');
      add.onclick = function () { haptic(); execAddMember(); };
      main.appendChild(add);

      main.appendChild(el('<h2 class="section">Actives</h2>'));
      actives.forEach(function (m) { main.appendChild(execRosterRow(m, "actives")); });
      if (alumni.length) {
        main.appendChild(el('<h2 class="section">Alumni</h2>'));
        alumni.forEach(function (m) { main.appendChild(execRosterRow(m, "alumni")); });
      }
    }
    function execRosterRow(m, rosterKind) {
      var b = brandFor(S.session.tenant);
      var row = el(
        '<div class="row" style="cursor:default">' +
          '<div class="crest" style="background:linear-gradient(135deg,' + b.primary + "," + b.dark + ')">' + esc(initials(m.name)) + "</div>" +
          '<div class="meta"><div class="name">' + esc(m.name) + '</div><div class="school">' + esc(m.email || m.position || m.major || "Member") + "</div></div>" +
          '<div class="act">' +
            '<button class="ib" data-act="reset" aria-label="Send reset link">' + ICON.key + '</button>' +
            '<button class="ib danger" data-act="remove" aria-label="Remove member">' + ICON.trash + '</button>' +
          '</div>' +
        "</div>"
      );
      row.querySelector('[data-act="reset"]').onclick = function () { haptic(); execReset(m); };
      row.querySelector('[data-act="remove"]').onclick = function () { haptic(); execRemove(m, rosterKind); };
      return row;
    }
    // Add member — minimal form sheet → POST /api/mobile/exec/roster {action:add}.
    function execAddMember() {
      var ov = el('<div style="position:fixed;inset:0;z-index:60;background:rgba(4,6,13,.66);display:grid;place-items:end center;padding:0"></div>');
      var sheet = el('<div style="width:100%;max-width:520px;background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;padding:18px 16px calc(18px + env(safe-area-inset-bottom))"></div>');
      sheet.appendChild(el('<h2 class="section" style="margin-top:0">Add member</h2>'));
      var seg = el('<div class="seg"><button data-r="actives" aria-selected="true">Active</button><button data-r="alumni" aria-selected="false">Alumni</button></div>');
      var kind = "actives";
      seg.querySelectorAll("button").forEach(function (b) { b.onclick = function () { kind = b.getAttribute("data-r"); seg.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); }); }; });
      sheet.appendChild(seg);
      var form = el('<form>' +
        '<div class="field"><label>Full name</label><input required placeholder="Jordan Lee" /></div>' +
        '<div class="field"><label>Email</label><input type="email" inputmode="email" autocapitalize="off" placeholder="jordan@example.com" /></div>' +
        '<div class="field"><label>Position (optional)</label><input placeholder="Member" /></div>' +
        '<button class="btn" type="submit">Add to roster</button>' +
        '<button class="btn ghost" type="button" style="margin-top:8px" data-cancel>Cancel</button>' +
      '</form>');
      var ins = form.querySelectorAll("input");
      var submit = form.querySelector(".btn");
      form.querySelector("[data-cancel]").onclick = function () { ov.remove(); };
      form.onsubmit = async function (e) {
        e.preventDefault();
        if (!ins[0].value.trim()) { toast("Name is required.", "err"); return; }
        submit.disabled = true; submit.textContent = "Adding…";
        if (isDemo()) {
          var nm = { id: "demo-" + Date.now(), name: ins[0].value.trim(), email: ins[1].value.trim() || null, position: ins[2].value.trim() || "Member" };
          (kind === "actives" ? S.data.roster.actives : S.data.roster.alumni).push(nm);
          ov.remove(); toast(nm.name + " added to the roster.", "ok"); paintDashboard(false); return;
        }
        var res = await authPost("/api/mobile/exec/roster", {
          action: "add", roster: kind, name: ins[0].value.trim(),
          email: ins[1].value.trim() || null, position: kind === "actives" ? (ins[2].value.trim() || null) : null
        });
        ov.remove();
        if (res.ok) { toast(ins[0].value.trim() + " added to the roster.", "ok"); await refetchDashboard(); }
        else if (res.status === 403) toast("Only chapter officers can add members.", "err");
        else toast(res.data.error || "Couldn't add the member.", "err");
      };
      sheet.appendChild(form); ov.appendChild(sheet); document.body.appendChild(ov);
    }
    async function execRemove(m, rosterKind) {
      var yes = await confirmDialog({ title: "Remove member?", message: "Remove " + m.name + " from the roster? This cannot be undone.", confirmText: "Remove", danger: true });
      if (!yes) return;
      if (isDemo()) {
        S.data.roster[rosterKind] = (S.data.roster[rosterKind] || []).filter(function (x) { return x.id !== m.id; });
        toast(m.name + " removed.", "ok"); paintDashboard(false); return;
      }
      var res = await authPost("/api/mobile/exec/roster", { action: "remove", roster: rosterKind, memberId: m.id });
      if (res.ok) { toast(m.name + " removed from the roster.", "ok"); await refetchDashboard(); }
      else if (res.status === 403) toast("Only chapter officers can remove members.", "err");
      else toast(res.data.error || "Couldn't remove the member.", "err");
    }
    async function execReset(m) {
      if (!m.email) { toast("No email on file for " + m.name + ".", "err"); return; }
      if (isDemo()) { toast("Reset link sent to " + m.email + ". (Demo)", "ok"); return; }
      toast("Sending a reset link to " + m.email + "…", "info");
      var res = await authPost("/api/mobile/exec/reset", { email: m.email });
      if (res.ok) toast("Password reset link sent to " + m.email + ".", "ok");
      else if (res.status === 403) toast("Only chapter officers can send reset links.", "err");
      else toast(res.data.error || "Couldn't send the reset link.", "err");
    }

    // ── OFFICER: Announce (post — persists to the server) ─────────────────────
