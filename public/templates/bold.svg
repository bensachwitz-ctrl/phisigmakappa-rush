<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bold Banner template wireframe">
  <rect width="400" height="300" fill="#ffffff"/>
  <!-- full-bleed banner hero with deep brand scrim + gold rules -->
  <rect width="400" height="168" fill="#1e40af"/>
  <rect width="400" height="168" fill="#0f2350" opacity="0.35"/>
  <rect width="400" height="6" fill="#f59e0b"/>
  <rect y="162" width="400" height="6" fill="#f59e0b" opacity="0.7"/>
  <!-- centered poster headline -->
  <rect x="110" y="40" width="180" height="14" rx="7" fill="#ffffff" opacity="0.5"/>
  <rect x="80" y="64" width="240" height="26" rx="6" fill="#ffffff"/>
  <rect x="120" y="98" width="160" height="26" rx="6" fill="#f59e0b"/>
  <rect x="150" y="134" width="100" height="16" rx="8" fill="#2563eb"/>
  <!-- promoted 2x2 big-type stats -->
  <rect x="40" y="186" width="155" height="44" rx="8" fill="#eff6ff"/>
  <rect x="205" y="186" width="155" height="44" rx="8" fill="#eff6ff"/>
  <rect x="56" y="200" width="60" height="16" rx="6" fill="#1e40af"/>
  <rect x="221" y="200" width="60" height="16" rx="6" fill="#f59e0b"/>
  <!-- gold greek-key divider + sections -->
  <rect x="40" y="244" width="320" height="4" fill="#f59e0b" opacity="0.6"/>
  <rect x="40" y="258" width="320" height="20" rx="6" fill="#eff6ff"/>
</svg>
