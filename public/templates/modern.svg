<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Modern Split template wireframe">
  <rect width="400" height="300" fill="#ffffff"/>
  <!-- gold top accent band -->
  <rect width="400" height="6" fill="#f59e0b"/>
  <!-- asymmetric split hero: copy left, collage right -->
  <rect y="6" width="400" height="150" fill="#f8fbff"/>
  <rect x="24" y="34" width="110" height="14" rx="7" fill="#f59e0b"/>
  <rect x="24" y="58" width="150" height="22" rx="6" fill="#1e40af"/>
  <rect x="24" y="86" width="120" height="22" rx="6" fill="#1e40af"/>
  <rect x="24" y="116" width="80" height="6" rx="3" fill="#f59e0b"/>
  <rect x="24" y="132" width="96" height="16" rx="8" fill="#2563eb"/>
  <!-- collage right (1.05fr) -->
  <rect x="214" y="24" width="162" height="118" rx="10" fill="#2563eb" opacity="0.9"/>
  <rect x="222" y="92" width="72" height="44" rx="6" fill="#ffffff" opacity="0.85"/>
  <rect x="300" y="92" width="68" height="44" rx="6" fill="#ffffff" opacity="0.7"/>
  <circle cx="214" cy="30" r="14" fill="#f59e0b"/>
  <!-- gold divider rhythm + sections -->
  <rect x="40" y="178" width="320" height="3" rx="1.5" fill="#f59e0b" opacity="0.5"/>
  <rect x="40" y="192" width="320" height="22" rx="6" fill="#eff6ff"/>
  <rect x="40" y="224" width="320" height="3" rx="1.5" fill="#f59e0b" opacity="0.5"/>
  <rect x="40" y="238" width="320" height="22" rx="6" fill="#eff6ff"/>
  <rect x="40" y="270" width="180" height="16" rx="6" fill="#dbe7fe"/>
</svg>
