# Codemagic CI/CD — Greek Stack companion iOS app → TestFlight.
#
# Mirrors the proven DailyTool / Bar Crawl Golf pipeline. Greek Stack differs in
# ONE way: it is a hosted Next.js SSR app, so the companion does NOT bundle a
# static export — capacitor.config.ts points server.url at
# https://greekstack.vercel.app/app and the native shell loads that. The build
# here therefore just generates the iOS project from the bundled boot shell
# (webDir: mobile-shell), signs it, archives it, and ships to TestFlight.
#
# Codemagic auto-detects this file at the repo root once the greek-stack GitHub
# repo is connected. It defines one workflow that, on a `v*` git tag:
#   1. Spins up a Mac Mini M2 runner
#   2. npm ci  (installs @capacitor/* from package.json on the Mac)
#   3. npx cap add ios   (generates ios/App/* from webDir: mobile-shell)
#   4. npx cap sync ios  (installs native plugin pods: push, preferences, etc.)
#   5. Sets MARKETING_VERSION from the tag (v1.2.3 → 1.2.3) + a monotonic build #
#   6. Patches Info.plist (push entitlement note) + iPhone-only device family
#   7. AUTOMATIC SIGNING: fetches (and creates if missing) the App Store
#      distribution cert + provisioning profile via the App Store Connect API key
#      alone — `app-store-connect fetch-signing-files` + `keychain
#      add-certificates` + `xcode-project use-profiles`. No .p12 / .mobileprovision
#      to manage by hand.
#   8. Archives + exports the IPA
#   9. Uploads to App Store Connect → TestFlight Internal Testing
#
# Trigger: a git tag matching `v*` (e.g. `v1.0.0`). NO auto-deploy of the web app.
#
# REQUIRED Codemagic environment variable group `greekstack_ios` (Codemagic UI →
# greek-stack → Environment variables → Add group). All marked Secret —
# JUST THE THREE App Store Connect API key vars (automatic signing derives the
# cert + profile from these; the old IOS_DIST_* / IOS_PROFILE_* secrets are no
# longer needed):
#
#   APP_STORE_CONNECT_KEY_IDENTIFIER   — ASC API key ID, 10 chars (e.g. ANZ67ZGPGR)
#   APP_STORE_CONNECT_ISSUER_ID        — ASC API issuer UUID
#   APP_STORE_CONNECT_PRIVATE_KEY_B64  — base64 of AuthKey_<KEYID>.p8
#
# The App ID (com.greekstack.app) needs the Associated Domains capability enabled
# in the Apple Developer portal for universal links. Push Notifications is NOT
# used by the shipped bundled shell, so neither the push capability nor an APNs
# Auth Key is required. The ASC API key needs the App Manager role so it can
# create the signing files.

workflows:
  ios-testflight:
    name: Greek Stack iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - greekstack_ios
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.greekstack.app"
      # Capacitor 8 (per @capacitor/cli 8.3.1 in package.json) requires Node >= 22.
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true

    integrations:
      app_store_connect: codemagic

    scripts:
      - name: Install npm deps
        script: |
          npm ci

      - name: "Ensure iOS platform exists (committed; regenerate only if absent)"
        # The ios/App Xcode project is COMMITTED to the repo (Info.plist, icons,
        # App.entitlements, URL scheme, signing settings) so the build is
        # deterministic and the native config is reviewed in git — not patched
        # blindly on every CI run. We only fall back to `cap add ios` in the
        # unlikely case the project is missing.
        script: |
          if [ ! -d ios/App/App.xcodeproj ]; then
            echo "ios/App missing — scaffolding (unexpected; project is normally committed)"
            npx cap add ios
          else
            echo "Using committed ios/App project."
          fi

      - name: Capacitor sync iOS (resolve SPM packages + copy web assets)
        # Capacitor 8 uses Swift Package Manager (no CocoaPods). `cap sync` copies
        # the boot shell (webDir: mobile-shell) into App/public, regenerates
        # capacitor.config.json, and wires the plugin Swift packages
        # (@capacitor/app, preferences, haptics, splash-screen, status-bar — NOT
        # push; the shipped shell does not use it) into CapApp-SPM. These are the
        # gitignored, regenerated bits.
        script: |
          npx cap sync ios

      - name: Set MARKETING_VERSION from tag + monotonic build number
        # MARKETING_VERSION (CFBundleShortVersionString) comes from the v* tag
        # that triggered the build: v1.2.3 → 1.2.3. CURRENT_PROJECT_VERSION
        # (CFBundleVersion) uses Codemagic's monotonic counter (+100 offset so
        # it never collides with any hand-set numbers already in ASC history).
        # App Store Connect rejects a duplicate (short version + build) pair.
        script: |
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          # Derive marketing version from the tag, stripping a leading "v".
          if [ -n "$CM_TAG" ]; then
            MARKETING_VERSION="${CM_TAG#v}"
          else
            MARKETING_VERSION=$(node -p "require('./package.json').version")
          fi
          if [ -n "$CM_BUILD_NUMBER" ]; then
            BUILD_NUMBER=$((CM_BUILD_NUMBER + 100))
          else
            BUILD_NUMBER=$(date +%s)
          fi
          echo "Setting MARKETING_VERSION=$MARKETING_VERSION CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
          if [ -f "$PBX" ]; then
            # iPhone-only (already set to 1 in the committed project; kept as a
            # belt-and-suspenders in case the project was regenerated above).
            sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = 1/g' "$PBX"
            sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $MARKETING_VERSION;/g" "$PBX"
            sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBX"
          fi

      - name: Force Manual signing on Release config (use-profiles writes the rest)
        # `cap add ios` defaults to Automatic signing + "iPhone Developer" on
        # Release. For automatic signing via the ASC API key we still archive with
        # CODE_SIGN_STYLE=Manual, because `xcode-project use-profiles` (run after the
        # fetch step below) writes the fetched distribution profile + cert identity
        # into the build settings and xcodebuild must honor those explicit values
        # rather than try to talk to a Developer-account session that doesn't exist
        # on the runner. Flip the identity to iPhone Distribution to match the
        # App Store cert that fetch-signing-files creates.
        script: |
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          if [ -f "$PBX" ]; then
            perl -i -p0e 's{(/\* Release \*/.*?CODE_SIGN_STYLE = )Automatic;}{$1Manual;}s' "$PBX"
            perl -i -p0e 's{(/\* Release \*/.*?CODE_SIGN_IDENTITY = )"iPhone Developer";}{$1"iPhone Distribution";}s' "$PBX"
            grep -c 'CODE_SIGN_STYLE = Manual' "$PBX" \
              | xargs -I{} echo "project.pbxproj: {} Manual signing references after patch"
          fi

      - name: Patch Info.plist export-compliance + strip unused push (survives cap add ios)
        # The shipped UI is the bundled Capacitor mobile-shell, which does NOT use
        # push. So we DO NOT add aps-environment / remote-notification anymore —
        # declaring them without use is an Apple 2.3.1 unused-capability risk. The
        # committed Info.plist + App.entitlements already omit push; this step is a
        # safety net that ALSO matters if the fallback `cap add ios` above
        # regenerated a default project (which would re-add push and omit the
        # export-compliance key).
        #
        # It injects ITSAppUsesNonExemptEncryption=false (standard HTTPS/TLS only)
        # so TestFlight does not stall on a manual export-compliance answer, and
        # removes any UIBackgroundModes / aps-environment that a regeneration added.
        script: |
          PLIST="ios/App/App/Info.plist"
          ENT="ios/App/App/App.entitlements"
          PB=/usr/libexec/PlistBuddy

          if [ -f "$PLIST" ]; then
            # Export compliance — add (or correct) ITSAppUsesNonExemptEncryption=false.
            "$PB" -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
              || "$PB" -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
            # Strip the unused push background mode if a regeneration re-added it.
            "$PB" -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
            echo "--- Info.plist (export-compliance + push state) ---"
            "$PB" -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST" || true
          fi

          # Strip the push entitlement if a regenerated entitlements file added it.
          if [ -f "$ENT" ]; then
            "$PB" -c "Delete :aps-environment" "$ENT" 2>/dev/null || true
            echo "--- App.entitlements ---"
            cat "$ENT"
          fi

      - name: Fetch signing files via App Store Connect API (automatic signing)
        # AUTOMATIC SIGNING. Instead of hand-managed .p12 + .mobileprovision
        # secrets, Codemagic's `app-store-connect` CLI uses the ASC API key
        # (the three APP_STORE_CONNECT_* vars + the `codemagic` integration) to
        # fetch — and `--create` if absent — the App Store distribution cert and
        # provisioning profile, install the cert into a fresh keychain, and write
        # the profile into the Xcode build settings. This removes the two most
        # common failure modes ("No signing certificate" / "profile doesn't
        # match") and the 5 fragile IOS_DIST_*/IOS_PROFILE_* secrets.
        script: |
          set -e

          # Validate the (now only three) required secrets.
          for var in APP_STORE_CONNECT_KEY_IDENTIFIER \
                     APP_STORE_CONNECT_ISSUER_ID \
                     APP_STORE_CONNECT_PRIVATE_KEY_B64; do
            eval "val=\${$var}"
            if [ -z "$val" ]; then
              echo "::error::Missing required env var: $var (add to greekstack_ios group)"
              exit 1
            fi
          done

          # Decode the ASC API key (.p8) — used both for signing-file fetch and
          # the later upload step.
          mkdir -p "$HOME/private_keys"
          API_KEY_FILE="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY_B64" | base64 --decode > "$API_KEY_FILE"
          chmod 600 "$API_KEY_FILE"
          head -1 "$API_KEY_FILE" \
            | grep -E "^-----BEGIN (PRIVATE|EC PRIVATE) KEY-----$" \
            || { echo "::error::API key file header check failed"; exit 1; }

          # Fresh keychain for the fetched distribution cert.
          keychain initialize

          # Fetch (creating if missing) the App Store distribution cert + profile
          # for the bundle id. --create provisions them on first run.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@file:$API_KEY_FILE" \
            --create

          # Add the fetched distribution certificate(s) to the keychain.
          keychain add-certificates

          # Write the fetched provisioning profile + cert identity into the Xcode
          # project build settings so the (Manual-style) archive uses them.
          xcode-project use-profiles

          echo "--- Codesigning identities ---"
          security find-identity -v -p codesigning || true

      - name: Archive + Export IPA (automatic signing via fetched profile)
        script: |
          set -e

          API_KEY_FILE="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"

          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_DIR"

          # `xcode-project use-profiles` (previous step) already wrote the correct
          # DEVELOPMENT_TEAM, CODE_SIGN_IDENTITY and PROVISIONING_PROFILE into the
          # build settings from the fetched profile, so we don't pass them by hand.
          xcodebuild \
            -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -authenticationKeyPath "$API_KEY_FILE" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

          # Export the archive to a signed App Store .ipa. Codemagic provides
          # `xcode-project use-profiles --export-options-plist` to emit a matching
          # ExportOptions.plist from the fetched profile.
          EXPORT_OPTIONS="$CM_BUILD_DIR/build/ios/ExportOptions.plist"
          xcode-project use-profiles \
            --export-options-plist "$EXPORT_OPTIONS"
          echo "--- ExportOptions.plist ---"
          cat "$EXPORT_OPTIONS"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$IPA_DIR" \
            -authenticationKeyPath "$API_KEY_FILE" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          ls -la "$IPA_DIR"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - bensachwitz@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Submit to TestFlight Internal Testing automatically. Apple takes
        # ~15 min to process the build before it appears for testers.
        submit_to_testflight: true
