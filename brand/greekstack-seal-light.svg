<?xml version="1.0" encoding="UTF-8"?>
<!--
  GREEKSTACK CANONICAL IDENTITY MARK — light tile (favicon / in-app / web icon).
  ===========================================================================
  IDENTICAL geometry to brand/greekstack-seal.svg (the navy seal); only the
  color presentation differs. Used to rasterize app/icon.png + app/apple-icon.png
  (the favicon / PWA / "Add to Home Screen" web icon) via scripts/gen-web-icons.mjs.

  Light palette:  tile #F7F5EE (border #E2DCCB) · temple #16264E · gold #C8901C

  Same 100-unit geometry as the navy seal — keep both files in lockstep with
  components/brand/greekstack-logo.tsx and every other surface.
-->
<svg width="1024" height="1024" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Greekstack">
  <!-- light ivory tile with a hairline warm border -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#F7F5EE"/>
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="#E2DCCB" stroke-width="1"/>
  <!-- navy temple group -->
  <g fill="#16264E">
    <path d="M16 44 L50 22 L84 44 Z"/>
    <rect x="14" y="46.5" width="72" height="5" rx="1"/>
    <rect x="21.5" y="52.5" width="9" height="2.2" rx="0.6"/>
    <rect x="23" y="54.7" width="6" height="15"/>
    <rect x="21.5" y="69.7" width="9" height="2.3" rx="0.6"/>
    <rect x="37.5" y="52.5" width="9" height="2.2" rx="0.6"/>
    <rect x="39" y="54.7" width="6" height="15"/>
    <rect x="37.5" y="69.7" width="9" height="2.3" rx="0.6"/>
    <rect x="53.5" y="52.5" width="9" height="2.2" rx="0.6"/>
    <rect x="55" y="54.7" width="6" height="15"/>
    <rect x="53.5" y="69.7" width="9" height="2.3" rx="0.6"/>
    <rect x="69.5" y="52.5" width="9" height="2.2" rx="0.6"/>
    <rect x="71" y="54.7" width="6" height="15"/>
    <rect x="69.5" y="69.7" width="9" height="2.3" rx="0.6"/>
    <rect x="18" y="72.5" width="64" height="3.2" rx="0.8"/>
    <rect x="13" y="76.2" width="74" height="3.4" rx="0.8"/>
  </g>
  <!-- restrained gold accents -->
  <g fill="#C8901C">
    <rect x="14" y="43.4" width="72" height="2" rx="1"/>
    <circle cx="50" cy="36" r="3"/>
    <rect x="16" y="51" width="68" height="1"/>
    <rect x="13" y="79.9" width="74" height="1.1"/>
  </g>
</svg>
